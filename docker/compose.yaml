name: databasify

x-app: &app
    image: ghcr.io/databasifylabs/databasify:${DATABASIFY_VERSION:-latest}
    env_file: .env
    environment:
        LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
        QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
        BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
        REDIS_HOST: ${REDIS_HOST:-valkey}
        REVERB_HOST: ${REVERB_HOST:-reverb}
        REVERB_PORT: ${REVERB_PORT:-8080}
        REVERB_SCHEME: ${REVERB_SCHEME:-http}
    volumes:
        - storage:/app/storage
    restart: unless-stopped
    depends_on:
        valkey:
            condition: service_healthy

services:
    web:
        <<: *app
        command: web
        ports:
            - '${HTTP_PORT:-80}:80'

    horizon:
        <<: *app
        command: horizon
        stop_grace_period: 30m
        healthcheck:
            disable: true
        depends_on:
            web:
                condition: service_healthy

    scheduler:
        <<: *app
        command: scheduler
        healthcheck:
            disable: true
        depends_on:
            web:
                condition: service_healthy

    reverb:
        <<: *app
        command: reverb
        healthcheck:
            disable: true
        depends_on:
            web:
                condition: service_healthy

    valkey:
        image: valkey/valkey:9.0-alpine@sha256:187679e3bd4036959631e3f03983ab2ba503ab21e6fd0454d508e909db2ee989
        command: valkey-server --appendonly yes
        volumes:
            - valkey:/data
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'valkey-cli', 'ping']
            interval: 10s
            timeout: 3s

volumes:
    storage:
    valkey:

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:redis]
command=redis-server /etc/redis/databasify.conf
user=redis
autostart=%(ENV_LOCAL_REDIS)s
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:php-fpm]
command=php-fpm8.5 --nodaemonize
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:reverb]
command=php /app/artisan reverb:start --host=127.0.0.1 --port=8080
user=www-data
priority=30
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:horizon]
command=php /app/artisan horizon
user=www-data
priority=30
startretries=100
stopwaitsecs=1800
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=php /app/artisan schedule:work
user=www-data
priority=30
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

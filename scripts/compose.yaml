name: databasify

services:
    app:
        image: ghcr.io/databasifylabs/databasify:${DATABASIFY_VERSION:-latest}
        env_file: .env
        ports:
            - '${HTTP_PORT:-80}:80'
        volumes:
            - storage:/app/storage
            - redis:/var/lib/redis
            - ./updater:/app/updater
        stop_grace_period: 30m
        restart: unless-stopped

volumes:
    storage:
    redis:
